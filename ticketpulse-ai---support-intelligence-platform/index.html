    <script>
      // Gracefully prevent sandbox/proxy WebSocket disconnects from surfacing as unhandled rejection overlays
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.description || reason)) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket'))) {
          event.preventDefault();
        }
      });
    </script>
